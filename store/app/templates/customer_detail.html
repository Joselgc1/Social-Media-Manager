<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cliente | Admin</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/dashboard.css"></head>
<body data-customer-id="__CUSTOMER_ID__" class="bg-gray-50 min-h-screen"><main class="max-w-6xl mx-auto px-4 py-8">
<a href="/admin/dashboard" class="detail-back-link">← Volver al dashboard</a><h1 id="customer-name" class="text-2xl font-bold mt-4">Cargando cliente...</h1>
<div class="grid md:grid-cols-2 gap-4 mt-6"><section class="card"><h2 class="font-semibold mb-4">Información</h2><div id="customer-info" class="detail-info-grid"></div><div class="mt-4"><label class="block text-sm text-gray-600 mb-1">Estado</label><div class="flex gap-2"><select id="customer-state" class="flex-1"><option value="active">Activo</option><option value="escalated">Escalado</option><option value="blocked">Bloqueado</option></select><button class="btn btn-primary" onclick="saveState()">Guardar</button></div></div></section>
<section class="card"><h2 class="font-semibold mb-4">Tags y marketing</h2><div id="customer-tags" class="customer-tags"></div><div id="marketing-consent" class="mt-4"></div><div class="flex gap-2 mt-4"><input id="new-tag" class="flex-1" placeholder="Nuevo tag"><button class="btn btn-primary" onclick="addTag()">Agregar</button></div></section></div>
<section class="card mt-4"><h2 class="font-semibold mb-4">Pedidos</h2><div id="customer-orders"></div></section></main><script src="/static/js/customer_detail.js"></script></body></html>

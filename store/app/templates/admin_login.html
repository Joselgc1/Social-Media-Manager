<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">__STORE_NAME__ Chatbot Admin</h1>
    <p class="text-sm text-gray-500 mb-6">Ingresa tu password para abrir el dashboard.</p>
    <div id="error-box" class="mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-3 text-sm" style="display:none"></div>
    <form method="post" action="/admin/login" class="space-y-4">
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autofocus
          class="w-full rounded-lg border border-gray-300 px-3 py-2"
          placeholder="ADMIN_PASSWORD"
        >
      </div>
      <button class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5">
        Entrar
      </button>
    </form>
  </div>
  <script>
    const error = new URLSearchParams(window.location.search).get('error');
    if (error) {
      const box = document.getElementById('error-box');
      box.textContent = error;
      box.style.display = 'block';
    }
  </script>
</body>
</html>

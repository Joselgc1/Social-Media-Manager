<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-8">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Master Control Plane</h1>
        <p class="text-sm text-slate-500 mb-6">Sign in with the master secret key.</p>
        <div id="error-box" class="mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-3 text-sm" style="display:none"></div>
        <form method="post" action="/login" class="space-y-4">
            <div>
                <label for="master_secret_key" class="block text-sm font-medium text-slate-700 mb-1">Master Secret Key</label>
                <input
                    id="master_secret_key"
                    name="master_secret_key"
                    type="password"
                    required
                    autofocus
                    class="w-full rounded-lg border border-slate-300 px-3 py-2"
                    placeholder="MASTER_SECRET_KEY"
                >
            </div>
            <button class="w-full rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5">
                Sign in
            </button>
        </form>
    </div>
    <script>
        const error = new URLSearchParams(window.location.search).get('error');
        if (error) {
            const box = document.getElementById('error-box');
            box.textContent = error;
            box.style.display = 'block';
        }
    </script>
</body>
</html>

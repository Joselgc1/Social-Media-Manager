name: CI

on:
  push:
  pull_request:

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt -r store/requirements.txt -r master/requirements.txt
      - run: ruff check store/ master/ tests/
      - run: python -m pytest tests/store tests/master -q
